name: Kensen Website CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================
  # 1. TEST
  # ==========================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Website Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -d images

          echo "All required files are present"
          echo "Test stage completed successfully"


  # ==========================
  # 2. BUILD
  # ==========================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Website
        run: |
          mkdir -p build

          cp index.html build/
          cp style.css build/
          cp script.js build/
          cp -r images build/

          echo "Website build completed"

      - name: Upload Build Files
        uses: actions/upload-artifact@v4
        with:
          name: kensen-website
          path: build/


  # ==========================
  # 3. DEPLOY
  # ==========================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Files
        uses: actions/download-artifact@v4
        with:
          name: kensen-website
          path: build/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy Website to EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p /tmp/kensen-deploy"

          scp -r build/* \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/kensen-deploy/

      - name: Deploy Website
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            sudo cp -r /tmp/kensen-deploy/* /var/www/html/

            sudo chown -R www-data:www-data /var/www/html

            sudo chmod -R 755 /var/www/html

            sudo nginx -t

            sudo systemctl restart nginx

            rm -rf /tmp/kensen-deploy

            echo "Deployment successful"

          EOF
