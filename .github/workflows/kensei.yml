name: AWS S3 Static Website CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # BUILD STAGE
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Website Files
        run: |
          echo "Checking website files..."
          test -f index.html
          echo "Build completed successfully!"

  # TEST STAGE
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML File
        run: |
          test -s index.html
          echo "Website test passed!"

  # DEPLOY STAGE
  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Website to S3
        run: |
          aws s3 sync . s3://proj-s3-pr/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

      - name: Deployment Completed
        run: |
          echo "Website successfully deployed to S3!"
